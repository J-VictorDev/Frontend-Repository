<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
	<title>Processando o Canvas na Seção HEAD</title>
	</head>
	<body>
		<canvas id="meu_canvas" width="500" height="500"></canvas>
		<script type="text/javascript">
			var canvas = document.getElementById('meu_canvas');
			var context = canvas.getContext('2d');
			
            //Fazendo um quadrado pequeno.
            //context.fillStyle = 'green';
            //context.fillRect(100, 50, 25, 25);

            //Salvando o quadrado verde.
            //context.save();


            //context.fillStyle = 'purple';
            //context.fillRect(100, 100, 25, 25);

            //context.restore();
            //context.fillRect(150, 50, 25, 25);

            //---------------------------//

            //Dados da bola.
            var x = 20;
            var y = 100;
            var raio = 5;
            //momento inicial
            var anterior = new Date().getTime();
            //inicia animação
            requestAnimationFrame(mexerBola);
            //função de animação
            function mexerBola(){
                //momento atual
                var agora = new Date().getTime();
                //diferença
                var decorrido = agora - anterior;
                //limpa o canvas
                context.clearRect(0, 0, canvas.width, canvas.height)
                //desenhar a bola
                context.beginPath();
                context.arc(x, y, raio, 0, Math.PI*2);
                context.fill();
                //deslocar 20 pixels para a direita
                var velocidade = 120;
                y -= velocidade * decorrido/1000;
                x += velocidade * decorrido/1000;
                // Guarda o instante para o próximo ciclo.
                anterior = agora;
                //Chamar o próximo ciclo da animação.
                requestAnimationFrame(mexerBola);
            }
		</script>	
	</body>
</html>
</body>
</html>
